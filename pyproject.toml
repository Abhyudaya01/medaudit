[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medaudit"
version = "0.1.0"
description = "Adversarial safety audit of LLMs for clinical use"
requires-python = ">=3.10"
authors = [{name = "Abhyudaya Lohani"}]
dependencies = ["pyyaml>=6", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8"]
all = ["openai>=1.40", "boto3>=1.34", "pytest>=8"]

[project.scripts]
medaudit = "medaudit.cli:main"

[tool.setuptools.packages.find]
include = ["medaudit*"]

[tool.setuptools.package-data]
medaudit = ["data/seeds/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real model APIs (opt in with --live)"]
